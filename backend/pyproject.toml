[project]
name = "nexis-finance-backend"
version = "1.0.0"
description = "Nexis Finance — quantitative research API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "B008",    # FastAPI dependency injection uses calls in defaults
    "RUF001",  # intentional unicode (×, →, −) in user-facing strings
    "RUF002",
    "RUF003",
    "SIM108",
    "E501",    # line length is enforced by `ruff format`; remaining cases are long prose strings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
